name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned deps
        run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Production build
        run: npm run build
      - name: Unit tests (hermetic)
        run: npx vitest run
      - name: Dependency audit
        run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned deps
        run: npm ci
      - name: Live Base RPC integration tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Live integration attempt ${attempt}/3"
            if npx vitest run -c vitest.integration.config.ts; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Live integration failed after 3 attempts"
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
