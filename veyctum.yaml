version: "1"
kind: miner
id: 9005
slug: veyctum
protocol: generic
name: Veyctum Transaction Effect Oracle
description: >
  Deterministic multi-chain EVM effect oracle. Returns an answer-first response
  by default and an explicit full response with observed Base USDC transfer
  effects, block/tx/log evidence, and finality facts so consumers can distinguish
  EVM execution success from fulfillment of an expected payment.

base_url: https://veyctum.splitpot.xyz

docs:
  repository: https://github.com/mystiquemide/veyctum

limitations:
  - code: MAX_PARAM_SIZE
    message: tx_hash must be a 32-byte EVM transaction hash (66 chars incl. 0x).
    param: tx_hash
    property: length
    value_num: 66
    operator: eq

auth:
  type: none          # public miner endpoint; no API key required

rate_limit_per_sec: 4 # enforced in code (NFR-005; fixed-window per IP, 429 + Retry-After)
cache_ttl_sec: 0
circuit_threshold: 3
circuit_cooldown_seconds: 20

endpoints:
  - path: /lookup
    external_path: /lookup
    method: GET
    description: Verify what an EVM transaction actually did, with optional structured Base USDC effects.
    param_map:
      chain: chain
      tx_hash: tx_hash
      format: format

input_schema:
  type: object
  properties:
    chain:
        type: string
    tx_hash:
        type: string
        pattern: ^0x[0-9a-fA-F]{64}$
    format:
        type: string
        enum:
              - answer
              - full
  required:
    - tx_hash

output_schema:
  type: object
  properties:
    answer:
        type: string
    summary:
        type: string
    chain:
        type: string
    schema_version:
        type: string
    chain_id:
        type: integer
    tx_hash:
        type: string
    state:
        type: string
    status:
        type: string
    finality:
        type: object
    effects:
        type: array
        items:
          type: object
    evidence:
        type: object
    error_code:
        type:
              - string
              - "null"
    error_detail:
        type:
              - string
              - "null"
  required:
    - answer

semantics:
  signal_mapping:
    label_field: answer
    reason_field: answer
  supported_intents:
    - ONCHAIN_TX_LOOKUP

# YAML is public. No API keys or private credentials belong in this file.
# Hosted copy: https://veyctum.splitpot.xyz/veyctum.yaml
# SHA-256 must be computed from the exact hosted bytes before registration.
